[project]
name = "world-xyz-limit-orders"
version = "0.1.0"
description = "Place your own limit orders on World (world.xyz) outcome tokens"
requires-python = ">=3.11"
dependencies = ["solders>=0.29", "typer>=0.26"]

[project.scripts]
mm = "mmkit.cli:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmkit"]

[tool.ruff]
line-length = 120
target-version = "py311"
